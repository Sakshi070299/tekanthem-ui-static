services:
  postgres:
    image: postgres:16-alpine
    container_name: tekanthem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tekanthem
    ports:
      - '5432:5432'
    volumes:
      - tekanthem-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tekanthem']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tekanthem-pgdata:
